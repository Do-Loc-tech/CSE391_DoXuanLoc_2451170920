<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground - ShopTLU</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <header class="header">
        <div class="logo">ShopTLU</div>
        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Danh mục</h3>
            <ul>
                <li>MacBook Neo</li>
                <li>iPhone 16 Pro</li>
                <li>Phụ kiện</li>
            </ul>
        </aside>

        <main class="content">
            <div class="product-card">
                <span class="badge-hot">HOT</span>
                <img src="https://via.placeholder.com/200" alt="Product">
                <h4>MacBook Neo 2026</h4>
                <p>Giá: 45.000.000đ</p>
            </div>
            
            <div style="height: 2000px; margin-top: 20px; background: #eee; padding: 20px;">
                <p>Cuộn trang xuống để kiểm tra Header Fixed và Sidebar Sticky...</p>
            </div>
        </main>
    </div>

    <button class="scroll-top">↑</button>

</body>
</html>
