<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout E-Commerce - ShopTLU</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="grid-container">
        <header class="header">
            <h1>ShopTLU Header</h1>
        </header>

        <section class="hero">
            <div class="hero-featured">
                <h2>Sản phẩm nổi bật: MacBook Neo M4</h2>
                <p>Hiệu năng đỉnh cao cho lập trình viên KTPM.</p>
            </div>
            <div class="hero-image">
                <img src="https://via.placeholder.com/400x200" alt="Featured">
            </div>
        </section>

        <aside class="sidebar">
            <h3>Bộ lọc</h3>
            <div class="filter-group">
                <label><input type="checkbox"> Apple</label><br>
                <label><input type="checkbox"> Samsung</label><br>
                <label><input type="checkbox"> Dell</label>
            </div>
            <div class="filter-group" style="margin-top: 20px;">
                <label><input type="checkbox"> Dưới 10tr</label><br>
                <label><input type="checkbox"> 10tr - 20tr</label>
            </div>
        </aside>

        <main class="main">
            <div class="product-grid">
                <!-- 6 Product Cards -->
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
                <div class="card">Card 4</div>
                <div class="card">Card 5</div>
                <div class="card">Card 6</div>
            </div>
        </main>

        <aside class="ads">
            <h3>Quảng cáo</h3>
            <img src="https://via.placeholder.com/180x400" alt="Ads">
        </aside>

        <footer class="footer">
            <p>&copy; 2026 ShopTLU - 66KTPM1 - Đỗ Xuân Lộc</p>
        </footer>
    </div>

</body>
</html>
