<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout - ShopTLU</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">ShopTLU</div>
        
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
        </ul>

        <div class="nav-auth">
            <button class="btn-login">Login</button>
            <button class="btn-register">Register</button>
        </div>
    </nav>

    <div class="container">
        <h2 style="margin: 30px 0; text-align: center;">Sản phẩm nổi bật</h2>
        <div class="product-grid">
            <!-- Lặp lại khối này 8 lần -->
            <div class="card">
                <img src="https://via.placeholder.com/250x180" alt="MacBook Neo">
                <div class="card-body">
                    <h3>MacBook Neo M4</h3>
                    <p class="price">45.000.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>
            
            <div class="card">
                <img src="https://via.placeholder.com/250x180" alt="iPhone 16">
                <div class="card-body">
                    <h3>iPhone 16 Pro Max</h3>
                    <p class="price">34.990.000đ</p>
                </div>
                <button class="btn-buy">Mua ngay</button>
            </div>

            <!-- ... Thêm 6 cards tương tự để đủ 8 cards ... -->
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 3</h3><p class="price">10.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 4</h3><p class="price">12.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 5</h3><p class="price">15.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 6</h3><p class="price">20.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 7</h3><p class="price">25.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
            <div class="card"><img src="https://via.placeholder.com/250x180"> <div class="card-body"><h3>Sản phẩm 8</h3><p class="price">30.000.000đ</p></div><button class="btn-buy">Mua ngay</button></div>
        </div>
    </div>

</body>
</html>
