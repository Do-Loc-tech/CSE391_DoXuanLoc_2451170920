<form action="#" method="POST">
    <fieldset>
        <legend>Thong tin tai khoan</legend>

        <!-- O nhap Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="you@email.com">

        <!-- O nhap mat khau -->
        <label for="pass">Mat khau:</label>
        <input type="password" id="pass" name="pass" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="It nhat 8 ky tu, gom chu hoa, thuong va so">

        <!-- O nhap so dien thoai -->
        <label for="phone">So dien thoai:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="090*******">

        <!-- O nhap ngay sinh -->
        <label for="dob">Ngay sinh:</label>
        <input type="date" id="dob" name="dob" max="2010-01-01">
    </fieldset>

<!-- Dong y dieu khoan -->
<label>
    <input type="checkbox" name="agree" required>
    Toi dong y dieu khoan
</label>

<!-- Nut submit -->
<button type="submit">Dang ky</button>

</form>
