<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Gallery — Session 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section id="portfolio" class="portfolio-section">
            <div class="container">
                <div class="portfolio-header">
                    <h2>My Portfolio</h2>
                    <div class="portfolio-filters">
                        <button class="filter-btn active">All</button>
                        <button class="filter-btn">Web</button>
                        <button class="filter-btn">Mobile</button>
                        <button class="filter-btn">Design</button>
                    </div>
                </div>

                <div class="portfolio-grid">
                    <article class="portfolio-item" data-category="web">
                        <a href="#lightbox-1" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=800&q=80" alt="E-Commerce Website">
                            <div class="portfolio-overlay">
                                <h3>E-Commerce Website</h3>
                                <p>React + Node.js</p>
                            </div>
                        </a>
                    </article>
                    <article class="portfolio-item" data-category="web">
                        <a href="#lightbox-2" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=800&q=80" alt="Dashboard UI">
                            <div class="portfolio-overlay">
                                <h3>Admin Dashboard</h3>
                                <p>Vue + REST API</p>
                            </div>
                        </a>
                    </article>
                    <article class="portfolio-item" data-category="mobile">
                        <a href="#lightbox-3" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80" alt="Mobile App">
                            <div class="portfolio-overlay">
                                <h3>Mobile App</h3>
                                <p>React Native</p>
                            </div>
                        </a>
                    </article>
                    <article class="portfolio-item" data-category="mobile">
                        <a href="#lightbox-4" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" alt="Product Launch App">
                            <div class="portfolio-overlay">
                                <h3>Launch App</h3>
                                <p>Design + UX</p>
                            </div>
                        </a>
                    </article>
                    <article class="portfolio-item" data-category="design">
                        <a href="#lightbox-5" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1487058792275-0ad4aaf24ca7?auto=format&fit=crop&w=800&q=80" alt="Brand Identity">
                            <div class="portfolio-overlay">
                                <h3>Brand Identity</h3>
                                <p>Visual Design</p>
                            </div>
                        </a>
                    </article>
                    <article class="portfolio-item" data-category="web">
                        <a href="#lightbox-6" class="lightbox-link">
                            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=800&q=80" alt="Landing Page">
                            <div class="portfolio-overlay">
                                <h3>Landing Page</h3>
                                <p>HTML + CSS</p>
                            </div>
                        </a>
                    </article>
                </div>
            </div>
        </section>

        <div id="lightbox-1" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80" alt="E-Commerce Website">
        </div>
        <div id="lightbox-2" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=80" alt="Admin Dashboard">
        </div>
        <div id="lightbox-3" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80" alt="Mobile App">
        </div>
        <div id="lightbox-4" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80" alt="Product Launch App">
        </div>
        <div id="lightbox-5" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1487058792275-0ad4aaf24ca7?auto=format&fit=crop&w=1200&q=80" alt="Brand Identity">
        </div>
        <div id="lightbox-6" class="lightbox">
            <a href="#portfolio" class="lightbox-close">×</a>
            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80" alt="Landing Page">
        </div>
    </main>
</body>
</html>
