<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Footer — Session 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section id="contact" class="contact-section">
            <div class="container">
                <h2>Get In Touch</h2>
                <div class="contact-wrapper">
                    <div class="contact-info">
                        <h3>Contact Information</h3>
                        <p>Feel free to reach out. I'm always open to discussing new projects.</p>
                        <div class="info-item">
                            <span class="icon">📧</span>
                            <span>loc.dx@example.com</span>
                        </div>
                        <div class="info-item">
                            <span class="icon">📍</span>
                            <span>Hanoi, Vietnam</span>
                        </div>
                    </div>
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
            </div>
        </section>

        <footer class="footer">
            <div class="container footer-content">
                <div>
                    <div class="footer-logo">YourName</div>
                    <p class="footer-tagline">Building digital experiences</p>
                </div>
                <div class="social-links">
                    <a href="#" class="social-link" aria-label="GitHub">GH</a>
                    <a href="#" class="social-link" aria-label="LinkedIn">LI</a>
                    <a href="#" class="social-link" aria-label="Email">@</a>
                </div>
                <p class="footer-copy">© 2026 YourName. All rights reserved.</p>
            </div>
        </footer>
    </main>
</body>
</html>
