<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sản phẩm</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="page-header">
        <h1>Quản lý danh sách sản phẩm</h1>
        <p>Giao diện nhập liệu và hiển thị danh sách sản phẩm một cách trực quan, rõ ràng</p>
      </header>
      <div class="content-grid">
        <section class="panel panel-form">
          <h2>Thêm sản phẩm mới</h2>
          <p>Nhập đầy đủ thông tin để thêm sản phẩm vào danh sách</p>
          <form id="productForm" class="product-form">
            <label>
              Tên sản phẩm
              <input type="text" id="name" placeholder="Nhập tên sản phẩm" />
            </label>
            <label>
              Danh mục
              <select id="category"></select>
            </label>
            <label>
              Giá
              <input type="number" id="price" placeholder="Nhập giá" />
            </label>
            <label>
              Trạng thái còn hàng
              <select id="status">
                <option value="Còn hàng">Còn hàng</option>
                <option value="Hết hàng">Hết hàng</option>
              </select>
            </label>
            <div class="form-actions">
              <button type="submit" class="btn-primary">Thêm sản phẩm</button>
              <button type="button" id="resetBtn" class="btn-secondary">Làm mới form</button>
            </div>
          </form>
        </section>

        <section class="panel panel-table">
          <div class="panel-title">
            <div>
              <h2>Danh sách sản phẩm</h2>            
            </div>
          </div>
          <div class="table-wrapper">
            <table class="product-table">
              <thead>
                <tr>
                  <th>STT</th>
                  <th>Tên sản phẩm</th>
                  <th>Danh mục</th>
                  <th>Giá</th>
                  <th>Trạng thái</th>
                </tr>
              </thead>
              <tbody id="productList"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
    <script src="data/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
